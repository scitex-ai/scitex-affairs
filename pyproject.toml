[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "scitex-affairs"
version = "0.2.0"
description = "Single-source business and personal affairs: catalogs, actuals, scenarios, reports, and plots"
readme = "README.md"
requires-python = ">=3.10"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
authors = [{name = "SciTeX Contributors"}]
keywords = ["affairs", "business", "forecasting", "pandas", "scitex"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Typing :: Typed",
]
dependencies = [
  "click>=8.1",
  "Django>=5.1",
  "pandas>=2.2",
  "PyYAML>=6.0",
  "scitex-app>=0.10.0",
  "scitex-config>=0.3.6",
  "scitex-dev>=0.56.9",
  "scitex-logging>=0.2.7",
  "scitex-ui>=0.19.1",
]

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "ruff>=0.11",
]
docs = [
  "sphinx>=7.0",
  "sphinx-rtd-theme>=2.0",
  "myst-parser>=2.0",
  "sphinx-copybutton>=0.5",
  "sphinx-autodoc-typehints>=1.25",
]
all = [
  "scitex-affairs[dev]",
  "figrecipe>=0.34.4",
  "plotly>=6.0",
]

[project.urls]
Homepage = "https://github.com/scitex-ai/scitex-affairs"
Repository = "https://github.com/scitex-ai/scitex-affairs"
Issues = "https://github.com/scitex-ai/scitex-affairs/issues"
Documentation = "https://scitex-affairs.readthedocs.io"

[project.scripts]
scitex-affairs = "scitex_affairs.cli:main"

[project.entry-points."scitex_dev.store.plugins"]
scitex-affairs = "scitex_affairs.actuals:provide_store_plugins"

[project.entry-points."scitex_dev.skills"]
scitex-affairs = "scitex_affairs"

[project.entry-points."scitex_dev.docs"]
scitex-affairs = "scitex_affairs"

[tool.hatch.build.targets.wheel]
packages = ["src/scitex_affairs"]
# Pre-built Sphinx HTML served in-wheel by scitex-cloud (PS-121); refreshed
# by the rtd-sphinx-build CI job on main/develop pushes.
artifacts = ["src/scitex_affairs/_sphinx_html/**/*"]

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/tests",
  "/examples",
  "/docs",
  "/README.md",
  "/LICENSE",
  "/CLA.md",
  "/CONTRIBUTING.md",
  "/CHANGELOG.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
  "smoke: fast subprocess checks of installed interfaces",
  "e2e: opt-in workflows against real local subsystems",
]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.scitex_dev]
mcp_parity_exempt = true
